<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Media</title>
</head>
<body>
    <!-- 
        - Embed Youtube Videos (<ifrmae>)
        - Audio <audio> and Video <video> tags
    -->

<!-- Embedded Youtube Video <iframe> -->
    <h1>Mohit Decodes HTML Lecture</h1>
    <iframe src="https://www.youtube.com/embed/6n0vYBcM9Lg" width="568" height="320" frameborder="0" allow="accelerometer; autplay; encrypted-media; picture-in-picture; gyroscope" allowfullscreen ></iframe>

<!-- Embed Audio <audio> -->
    <!-- audio -->
    <h1>Audio</h1>
    <audio controls autoplay>
        <source src="./media/kalyani_remix.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>  
      <!-- embed video  -->
      <h1>Video</h1>
    <video width="320" height="240" controls autoplay loop>
        <source src="./media/video1.mp4" type="video/mp4">
        Your browser does not support the video tag. 
    <!-- Create a music player with a playlist -->
</body>
</html>
