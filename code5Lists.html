<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>
    <!-- Unordered List -->
     <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
     </ul>

     <!-- Ordered List -->
      <ol reversed>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
      </ol>

      <ol type="a">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
      </ol>

      <!-- Description List -->

      <dl>
        <dt>Apple</dt>
        <dd>It's a fruit</dd>
        <dt>Mango</dt>
        <dd>It's a fruit</dd>
        <dt>Banana</dt>
        <dd>It's a fruit</dd>
      </dl>
</body>
</html>
